name: Deploy Veerhau

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}

          script: |
            set -e

            cd /home/other/veerhau/veerhau_game_companion

            database_path="data/chronicle.db"
            database_backup="/home/other/veerhau/chronicle.db.deploy-backup"
            service_stopped=0

            restore_database() {
              if [ -f "$database_backup" ]; then
                mkdir -p data
                mv -f "$database_backup" "$database_path"
              fi
            }

            cleanup() {
              exit_code=$?
              trap - EXIT
              restore_database
              if [ "$service_stopped" -eq 1 ]; then
                systemctl start veerhau || true
              fi
              exit "$exit_code"
            }

            trap cleanup EXIT

            if [ ! -f "$database_path" ]; then
              echo "Server database is missing: $database_path"
              exit 1
            fi

            echo "Stopping application before preserving its database..."
            systemctl stop veerhau
            service_stopped=1

            echo "Preserving the current server database..."
            cp "$database_path" "$database_backup"

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            echo "Restoring the current server database..."
            restore_database

            echo "Installing Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt

            echo "Building frontend..."
            cd frontend
            npm ci
            npm run build
            cd ..

            echo "Restarting service..."
            systemctl restart veerhau
            service_stopped=0
            trap - EXIT

            echo "Waiting for application..."
            
            for i in {1..15}; do
                if curl -fs http://127.0.0.1:8787 > /dev/null; then
                    echo "Application is running!"
                    exit 0
                fi
            
                sleep 2
            done
            
            echo "Application failed to start"
            systemctl status veerhau --no-pager
            journalctl -u veerhau -n 50 --no-pager
            exit 1
